<!DOCTYPE html>
<html>
<head>
    <title>ShopDynamic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f5f5f5; }
        .card img { height: 140px; object-fit: cover; }
        #cart { position: sticky; top: 10px; }
    </style>
</head>

<body>

<nav class="navbar bg-white p-3">
    <h4>ShopDynamic</h4>
</nav>

<div class="container-fluid mt-4">
    <div class="row">

        <div class="col-md-9">
            <div class="row g-3" id="products"></div>
        </div>

        <div class="col-md-3">
            <div class="card p-3" id="cart">
                <h5>Shopping Cart</h5>
                <div id="items">Cart is empty</div>
                <hr>
                <h5>Grand Total: ₹<span id="total">0</span></h5>
            </div>
        </div>

    </div>
</div>

<script>

const products = [
    {id:1, name:"Headphones", price:2499, original:3499, discount:29,
    image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", stock:true},

    {id:2, name:"Smart Watch", price:1999, original:2999, discount:33,
    image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500", stock:true},

    {id:3, name:"Running Shoes", price:1799, original:2499, discount:28,
    image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", stock:true},

    {id:4, name:"Backpack", price:1299, original:1999, discount:35,
    image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500", stock:true},

    {id:5, name:"Digital Camera", price:15999, original:18999, discount:16,
    image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500", stock:true},

    {id:6, name:"Sunglasses", price:899, original:1499, discount:40,
    image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500", stock:true},

    {id:7, name:"Coffee Maker", price:3499, original:4499, discount:22,
    image:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500", stock:false}
];

let cart = {};

document.getElementById("products").innerHTML =
products.map(p => `
<div class="col-md-4 col-sm-6">
    <div class="card p-2">
        <img src="${p.image}" class="card-img-top">

        <div class="card-body">
            <h5>${p.name}</h5>
            <p>₹${p.price} <del>₹${p.original}</del></p>
            <p>${p.discount}% OFF</p>

            <button class="btn btn-success w-100"
            onclick="add(${p.id})" ${p.stock ? "" : "disabled"}>
            ${p.stock ? "Add to Cart" : "Out of Stock"}
            </button>
        </div>
    </div>
</div>
`).join("");

function add(id) {
    cart[id] = (cart[id] || 0) + 1;
    showCart();
}

function change(id, n) {
    cart[id] += n;

    if(cart[id] <= 0)
        delete cart[id];

    showCart();
}

function showCart() {
    let total = 0;

    document.getElementById("items").innerHTML =
    Object.keys(cart).map(id => {
        let p = products.find(x => x.id == id);
        let q = cart[id];
        let sub = p.price * q;

        total += sub;

        return `
        <div class="mb-3">
            <b>${p.name}</b><br>
            ₹${p.price}<br>

            <button onclick="change(${id},-1)">-</button>
            ${q}
            <button onclick="change(${id},1)">+</button>

            <br>Subtotal: ₹${sub}
        </div>
        `;
    }).join("") || "Cart is empty";

    document.getElementById("total").innerText = total;
}

</script>

</body>
</html>
